services:
  - type: web
    name: lulsrng-api
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn lulsrng_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LULSRNG_DB_URL
        sync: false
      - key: LULSRNG_API_TOKEN
        sync: false
